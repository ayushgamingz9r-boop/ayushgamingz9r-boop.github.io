<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AYUSH GAMING — Neon Rush 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,sans-serif}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{display:flex;justify-content:space-between;gap:12px;padding:16px}.brand{font-weight:900;letter-spacing:2px;font-size:18px;text-shadow:0 0 12px #f22}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:rgba(10,10,10,.72);border:1px solid #f22;border-radius:12px;padding:8px 12px;font-weight:800;min-width:85px;text-align:center}.label{font-size:10px;color:#aaa;display:block}.value{font-size:16px}
#message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.72);border:1px solid #f22;border-radius:20px;padding:28px 34px;min-width:280px;box-shadow:0 0 35px rgba(255,0,0,.22)}#message h1{margin:0 0 8px;font-size:30px}#message p{margin:5px 0;color:#bbb}button{border:0;border-radius:12px;padding:12px 22px;background:#e50914;color:#fff;font-weight:900;cursor:pointer}#startBtn{margin-top:16px}
#nitro{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(340px,45vw);height:12px;border:1px solid #fff;border-radius:20px;overflow:hidden;background:#111}#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#e00,#ffb000);box-shadow:0 0 15px #f00}
.controls{position:absolute;bottom:22px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:auto}.pad{display:flex;gap:10px}.ctrl{width:64px;height:64px;border-radius:18px;background:rgba(10,10,10,.65);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:25px;touch-action:none;user-select:none}.ctrl:active{background:#b00}.hint{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);font-size:11px;color:#aaa;white-space:nowrap}
@media(min-width:800px){.controls{opacity:.45}.controls:hover{opacity:1}}@media(max-width:600px){.brand{font-size:14px}.pill{padding:6px 9px;min-width:70px}.value{font-size:14px}.ctrl{width:58px;height:58px}.hint{display:none}}
</style>
</head>
<body>
<div id="hud"><div class="top"><div class="brand">AYUSH GAMING // NEON RUSH 3D</div><div class="stats"><div class="pill"><span class="label">SPEED</span><span class="value" id="speed">0</span></div><div class="pill"><span class="label">LAP</span><span class="value" id="lap">1/3</span></div><div class="pill"><span class="label">SCORE</span><span class="value" id="score">0</span></div></div></div><div id="message"><h1>NEON RUSH</h1><p>3D Racing Challenge</p><p>WASD / Arrow Keys • Space = Nitro</p><button id="startBtn">START RACE</button></div><div id="nitro"><div id="nitroFill"></div></div><div class="hint">Keyboard: ← → steer · ↑ accelerate · ↓ brake · SPACE nitro</div><div class="controls"><div class="pad"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="pad"><button class="ctrl" data-key="brake">▼</button><button class="ctrl" data-key="up">▲</button><button class="ctrl" data-key="nitro">⚡</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b12);scene.fog=new THREE.Fog(0x070b12,70,420);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,700);camera.position.set(0,7,13);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9fbaff,0x202020,1.8));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const roadMat=new THREE.MeshStandardMaterial({color:0x25252b,roughness:.95}),lineMat=new THREE.MeshBasicMaterial({color:0xffffff}),grassMat=new THREE.MeshStandardMaterial({color:0x101c12});
const track=new THREE.Group();scene.add(track);
const roadWidth=18, radiusX=78, radiusZ=48;const segments=180;
function curvePoint(t,offset=0){const a=t*Math.PI*2;return new THREE.Vector3(Math.cos(a)*(radiusX+offset),0,Math.sin(a)*(radiusZ+offset));}
for(let i=0;i<segments;i++){const t=i/segments,t2=(i+1)/segments,p=curvePoint(t),q=curvePoint(t2),mid=p.clone().add(q).multiplyScalar(.5);const len=p.distanceTo(q),ang=-Math.atan2(q.z-p.z,q.x-p.x)+Math.PI/2;const road=new THREE.Mesh(new THREE.BoxGeometry(roadWidth,.25,len+1),roadMat);road.position.set(mid.x,-.05,mid.z);road.rotation.y=ang;road.receiveShadow=true;track.add(road);if(i%4===0){const dash=new THREE.Mesh(new THREE.BoxGeometry(.22,.08,3),lineMat);dash.position.copy(mid);dash.position.y=.11;dash.rotation.y=ang;track.add(dash)}}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.2;ground.receiveShadow=true;scene.add(ground);
function addTree(x,z,s=1){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,3,8),new THREE.MeshStandardMaterial({color:0x5b321e}));trunk.position.y=1.5;const crown=new THREE.Mesh(new THREE.ConeGeometry(2.4*s,6*s,9),new THREE.MeshStandardMaterial({color:0x163d20}));crown.position.y=5;g.add(trunk,crown);g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g)}
for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,r=70+Math.random()*35;addTree(Math.cos(a)*r,Math.sin(a)*(r*.62),.7+Math.random()*.6)}
function makeCar(color){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.65,4.3),new THREE.MeshStandardMaterial({color,metalness:.35,roughness:.3}));body.position.y=.8;body.castShadow=true;g.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.7,.65,1.8),new THREE.MeshStandardMaterial({color:0x10151e,metalness:.1,roughness:.15}));cabin.position.set(0,1.25,.15);cabin.castShadow=true;g.add(cabin);for(const x of[-1,1])for(const z of[-1,1]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.32,16),new THREE.MeshStandardMaterial({color:0x080808}));w.rotation.z=Math.PI/2;w.position.set(x*1.05,.48,z*1.45);w.castShadow=true;g.add(w)}return g}
const car=makeCar(0xd80018);scene.add(car);car.position.copy(curvePoint(.0,-2));car.position.y=.15;
const opponents=[];for(let j=0;j<5;j++){const c=makeCar([0x1976ff,0xff8f00,0x7c3aed,0x16a34a,0xf5f5f5][j]);c.scale.setScalar(.92);scene.add(c);opponents.push({mesh:c,t:(j+1)/6,speed:.0009+j*.00007})}
const pickups=[];function addPickup(t){const m=new THREE.Mesh(new THREE.TorusGeometry(.7,.18,10,20),new THREE.MeshStandardMaterial({color:0xffb000,emissive:0xff3300,emissiveIntensity:1.5}));m.position.copy(curvePoint(t,-2));m.position.y=1.2;m.rotation.x=Math.PI/2;scene.add(m);pickups.push({mesh:m,t,got:false})}for(let i=0;i<14;i++)addPickup((i+.5)/14);
let running=false,finished=false,t=.0,speed=0,score=0,lap=1,nitro=100,lapProgress=0;const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('.ctrl').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{keys[k]=false}))});
function start(){running=true;finished=false;t=0;speed=0;score=0;lap=1;lapProgress=0;nitro=100;pickups.forEach(p=>p.got=false);document.getElementById('message').style.display='none'}
document.getElementById('startBtn').onclick=start;
function input(name){return name==='left'?keys.ArrowLeft||keys.KeyA||keys.left:name==='right'?keys.ArrowRight||keys.KeyD||keys.right:name==='up'?keys.ArrowUp||keys.KeyW||keys.up:name==='brake'?keys.ArrowDown||keys.KeyS||keys.brake:name==='nitro'?keys.Space||keys.nitro:false}
function finish(){running=false;finished=true;document.getElementById('message').innerHTML='<h1>RACE COMPLETE!</h1><p>Score: <b>'+Math.floor(score)+'</b></p><p>Great run. Your next race can be even faster.</p><button id="startBtn">RACE AGAIN</button>';document.getElementById('message').style.display='block';document.getElementById('startBtn').onclick=start;try{localStorage.setItem('ayush_racing_best',Math.max(Number(localStorage.getItem('ayush_racing_best')||0),Math.floor(score)))}catch(e){}}
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/16.67,2);last=now;if(running){const accel=input('up')?0.0018:-0.0005;speed+=accel*dt;if(input('brake'))speed-=0.002*dt;const boost=input('nitro')&&nitro>0;if(boost){speed+=0.0035*dt;nitro-=.75*dt}else nitro=Math.min(100,nitro+.12*dt);speed=Math.max(0,Math.min(.022,speed));const steer=(input('left')?-1:0)+(input('right')?1:0);t=(t+speed*dt)%1;lapProgress+=speed*dt;if(lapProgress>=1){lapProgress-=1;lap++;if(lap>3){score+=1000;finish()}}const center=curvePoint(t,-2);const tangent=curvePoint(t+.002,-2).sub(center).normalize();const desiredX=center.x,desiredZ=center.z;car.position.x+=(desiredX-car.position.x)*.18;car.position.z+=(desiredZ-car.position.z)*.18;car.rotation.y=Math.atan2(tangent.x,tangent.z)+steer*.22;car.position.y=.15+Math.sin(now*.006)*.025;score+=speed*25*dt;opponents.forEach(o=>{o.t=(o.t+o.speed*dt*(speed/.012+.35))%1;o.mesh.position.copy(curvePoint(o.t,-2));o.mesh.position.y=.15;o.mesh.rotation.y=Math.atan2(curvePoint(o.t+.002,-2).x-o.mesh.position.x,curvePoint(o.t+.002,-2).z-o.mesh.position.z)});pickups.forEach(p=>{p.mesh.rotation.z+=.04*dt;if(!p.got){p.mesh.position.y=1.1+Math.sin(now*.005+p.t*20)*.15;const d=car.position.distanceTo(p.mesh.position);if(d<3){p.got=true;p.mesh.visible=false;score+=150;nitro=Math.min(100,nitro+20)}}});const camTarget=curvePoint(t,-2);const camPos=curvePoint(t-.018,-2).add(new THREE.Vector3(0,6,0));camera.position.lerp(camPos,.12);camera.lookAt(camTarget.x,1.2,camTarget.z)}renderer.render(scene,camera);document.getElementById('speed').textContent=Math.round(speed*520);document.getElementById('lap').textContent=Math.min(lap,3)+'/3';document.getElementById('score').textContent=Math.floor(score);document.getElementById('nitroFill').style.width=nitro+'%'}requestAnimationFrame(animate);animate(performance.now());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script>
</body></html>
