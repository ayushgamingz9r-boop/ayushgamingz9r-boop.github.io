<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AYUSH GAMING — Street Rush</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07090d;font-family:Arial;color:white}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:18px;gap:12px}.box{background:#080b12cc;border:1px solid #ffffff22;border-radius:14px;padding:9px 14px;backdrop-filter:blur(8px);text-shadow:0 2px 4px #000}.speed{font-size:28px;font-weight:900}.nitro{width:180px;height:10px;background:#222;border-radius:9px;overflow:hidden}.nitro i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#00d9ff,#fff);box-shadow:0 0 15px #00d9ff}.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}.title{font-size:44px;font-weight:1000;letter-spacing:3px;text-shadow:0 0 22px #f22}.btn{pointer-events:auto;border:0;border-radius:13px;padding:15px 28px;background:linear-gradient(135deg,#ff1e1e,#8b0000);color:#fff;font-weight:900;font-size:18px;box-shadow:0 8px 25px #0008;cursor:pointer}.hidden{display:none}.controls{position:absolute;bottom:25px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:auto}.steer,.pedals{display:flex;gap:12px}.ctrl{width:70px;height:60px;border:1px solid #fff3;border-radius:16px;background:#10151dcc;color:#fff;font-size:25px;font-weight:bold;touch-action:none}.small{font-size:13px;color:#bbb}.finish{font-size:32px;font-weight:900}.flash{animation:f .15s linear}@keyframes f{50%{filter:brightness(2)}}@media(min-width:800px){.controls{opacity:.35}.controls:hover{opacity:1}}</style></head><body><div id="hud" class="hud"><div class="top"><div class="box"><div id="lap">LAP 1/3</div><div class="small" id="pos">POSITION 1/6</div></div><div class="box" style="text-align:right"><div class="speed"><span id="speed">0</span> KM/H</div><div class="nitro"><i id="nitro"></i></div></div></div><div id="message" class="center"><div class="title">STREET RUSH</div><p>AYUSH GAMING • NIGHT CIRCUIT</p><button class="btn" id="start">START RACE</button></div><div class="controls"><div class="steer"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="pedals"><button class="ctrl" id="brake">▼</button><button class="ctrl" id="gas">▲</button><button class="ctrl" id="boost">⚡</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070b);scene.fog=new THREE.Fog(0x05070b,45,230);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bb8ff,0x161616,1.5));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-30,60,20);sun.castShadow=true;scene.add(sun);
function mat(c,rough=1){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.15})}function box(x,y,z,c){let m=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat(c));m.castShadow=m.receiveShadow=true;return m}
const road=box(18,.2,700,0x24272b);road.position.z=70;scene.add(road);const side1=box(32,.15,700,0x101318),side2=side1.clone();side1.position.set(-25,.05,70);side2.position.set(25,.05,70);scene.add(side1,side2);
for(let z=-260;z<420;z+=12){for(let x of [-4.5,4.5]){let l=box(.35,.03,6,0xf4f4f4);l.position.set(x,.13,z);scene.add(l)}}
for(let z=-260;z<420;z+=18){for(let x of [-13,13]){let l=box(.18,.05,9,0xff2020);l.position.set(x,.2,z);scene.add(l)}}
// city blocks
for(let z=-240;z<390;z+=25){for(let side of [-1,1]){let h=5+Math.random()*18,w=5+Math.random()*8;let b=box(w,h,14,0x151a22);b.position.set(side*(19+Math.random()*5),h/2,z+Math.random()*8);scene.add(b);let n=box(w+.1,.12,14.1,0x262c37);n.position.set(b.position.x,h+.05,b.position.z);scene.add(n)}}
function car(color=0xff1b1b){let g=new THREE.Group();let body=box(2.1,.55,4.1,color);body.position.y=.65;g.add(body);let cabin=box(1.55,.5,1.8,0x101820);cabin.position.set(0,1.02,-.15);g.add(cabin);for(let x of [-1.05,1.05])for(let z of [-1.35,1.35]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.24,16),mat(0x090909));w.rotation.z=Math.PI/2;w.position.set(x,.42,z);g.add(w)}let light=box(.55,.18,.12,0xffe8b0);light.position.set(-.55,.78,-2.06);let light2=light.clone();light2.position.x=.55;g.add(light,light2);g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g}
const player=car(0xe51414);player.position.set(0,0,180);scene.add(player);let rivals=[];[-6,-2,3,7,0].forEach((x,i)=>{let r=car([0x1688ff,0xffa500,0x8d42ff,0x19d37c,0xffffff][i]);r.position.set(x,0,150-i*20);r.userData={speed:18+Math.random()*7,lane:x};scene.add(r);rivals.push(r)});
let pickups=[];for(let i=0;i<24;i++){let p=new THREE.Mesh(new THREE.TorusGeometry(.65,.16,8,20),mat(0x00d9ff));p.rotation.x=Math.PI/2;p.position.set([-6,-2,2,6][i%4],1,130-i*16);p.userData.taken=false;scene.add(p);pickups.push(p)}
let keys={},running=false,lap=1,boost=100,speed=0,distance=0,score=0,checkpoint=0,last=performance.now();addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function hold(id,key){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[key]=true};['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,()=>keys[key]=false))}hold('left','arrowleft');hold('right','arrowright');hold('gas','arrowup');hold('brake','arrowdown');hold('boost',' ');
const $=id=>document.getElementById(id);$('start').onclick=start;function start(){running=true;lap=1;boost=100;distance=0;score=0;speed=0;player.position.set(0,0,180);$('message').classList.add('hidden');last=performance.now();}
function reset(){rivals.forEach((r,i)=>r.position.set(r.userData.lane,0,150-i*20));pickups.forEach((p,i)=>{p.position.set([-6,-2,2,6][i%4],1,130-i*16);p.userData.taken=false;p.visible=true})}
function finish(){running=false;$('message').innerHTML='<div class="finish">🏁 RACE COMPLETE</div><p>SCORE: '+Math.floor(score)+'</p><button class="btn" onclick="start();reset()">RACE AGAIN</button>';$('message').classList.remove('hidden')}
function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000,.035);last=t;if(running){let gas=keys.arrowup||keys.w,brake=keys.arrowdown||keys.s,left=keys.arrowleft||keys.a,right=keys.arrowright||keys.d,n=keys[' '];let target=gas?42:brake?10:28;if(n&&boost>0){target=62;boost=Math.max(0,boost-35*dt)}else boost=Math.min(100,boost+9*dt);speed+=(target-speed)*dt*3;let steer=(right?1:0)-(left?1:0);player.position.x+=steer*(5.5+speed/15)*dt;player.position.x=Math.max(-7.5,Math.min(7.5,player.position.x));player.position.z-=speed*dt;player.rotation.y=-steer*.16;distance+=speed*dt;score+=speed*dt*.8;
for(let r of rivals){r.position.z-=r.userData.speed*dt;if(r.position.z>player.position.z+20)r.position.z-=400;if(Math.abs(r.position.x-player.position.x)<1.5&&Math.abs(r.position.z-player.position.z)<2.8){speed*=.55;score=Math.max(0,score-100);}}
for(let p of pickups){p.rotation.z+=dt*4;if(!p.userData.taken&&Math.abs(p.position.x-player.position.x)<1.7&&Math.abs(p.position.z-player.position.z)<3){p.userData.taken=true;p.visible=false;boost=Math.min(100,boost+28);score+=250}}
let d=Math.abs(180-player.position.z);lap=Math.min(3,Math.floor(d/500)+1);if(lap>checkpoint){checkpoint=lap;$('lap').textContent='LAP '+lap+'/3'}if(d>=1500)finish();$('speed').textContent=Math.floor(speed*3.6);$('nitro').style.width=boost+'%';let pos=1+rivals.filter(r=>r.position.z<player.position.z).length;$('pos').textContent='POSITION '+Math.min(6,pos)+'/6';}
let targetCam=new THREE.Vector3(player.position.x*.45,5.1,player.position.z+10);camera.position.lerp(targetCam,.08);camera.lookAt(player.position.x*.2,1,player.position.z-16);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop(performance.now());</script></body></html>
